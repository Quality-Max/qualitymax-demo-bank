<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Bank — Settings</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">Demo Bank</div>
    <div class="nav-links">
      <a href="/dashboard" data-test="nav-dashboard">Dashboard</a>
      <a href="/transfer" data-test="nav-transfer">Transfer</a>
      <a href="/transactions" data-test="nav-transactions">Transactions</a>
      <a href="/settings" class="active" data-test="nav-settings">Settings</a>
    </div>
    <div class="nav-user"><span id="user-name"></span><button onclick="logout()" data-test="logout-button">Logout</button></div>
  </nav>
  <div class="container">
    <h1 class="page-title">Account Settings</h1>
    <div class="card">
      <div id="alert" class="alert" style="display:none;"></div>
      <form id="settings-form">
        <div class="form-group">
          <label for="name">Display Name</label>
          <!-- BUG: XSS — value rendered without escaping in dashboard/nav -->
          <input type="text" id="name" class="form-input" data-test="display-name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" data-test="email" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="role" class="form-input" data-test="role" disabled>
          <!-- BUG: Role field is disabled in UI but the API accepts role changes (mass assignment) -->
        </div>
        <button type="submit" class="btn btn-primary" data-test="save-settings">Save Changes</button>
      </form>
    </div>
    <div class="card" style="margin-top:24px;">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Danger Zone</h2>
      <p style="font-size:14px;color:#666;margin-bottom:12px;">These actions are irreversible.</p>
      <!-- BUG: No confirmation dialog for dangerous actions -->
      <button class="btn btn-danger" data-test="delete-account">Delete Account</button>
    </div>
  </div>
  <script>
    async function loadSettings() {
      const res = await fetch('/api/me');
      if (!res.ok) return window.location.href = '/login';
      const user = await res.json();
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('name').value = user.name;
      document.getElementById('email').value = user.email;
      document.getElementById('role').value = user.role;
    }

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      const res = await fetch('/api/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        alert.className = 'alert alert-success';
        alert.textContent = 'Settings saved successfully!';
        document.getElementById('user-name').textContent = data.user.name;
      } else {
        alert.className = 'alert alert-error';
        alert.textContent = data.error || 'Failed to save';
      }
      alert.style.display = 'block';
    });

    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/login'; }
    loadSettings();
  </script>
</body>
</html>
